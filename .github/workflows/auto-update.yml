name: Auto Update Tasks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

jobs:
  draft-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Draft update plan
        run: python3 scripts/auto_update.py --dry-run
